# Generic startup file for the Laravel application behind Nginx.
user www-data;

# Run one worker per CPU by default for better concurrency on the container host.
worker_processes  auto;
worker_cpu_affinity auto;

error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

# Keeps the logs free of messages about not being able to bind().
#daemon     off;

events {
    worker_connections  1024;
}

http {
#   rewrite_log on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Flag connections originating from RFC-1918 private ranges.
    geo $is_private_ip {
        default          0;
        10.0.0.0/8       1;
        172.16.0.0/12    1;
        192.168.0.0/16   1;
        127.0.0.0/8      1;
    }

    # Deny plain-HTTP access when the client is not on a private network.
    map "$server_port:$is_private_ip" $deny_http {
        default  0;
        "80:0"   1;
    }

    # Load the standard MIME type mappings used by Nginx.
    include mime.types;
    default_type       application/octet-stream;

    # Standard logs and basic performance settings.
    access_log         /var/log/nginx/access.log;
    sendfile           on;
#   tcp_nopush         on;
    keepalive_timeout  64;
#   tcp_nodelay        on;

    # Trust the forwarded client IP from any reverse proxy in logs.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Enable gzip compression for common text and web asset formats.
    gzip on;
    gzip_disable "msie6";

    disable_symlinks off;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Limit the maximum client upload size to match the application constraints.
    client_max_body_size 13m;
    index              index.php index.html index.htm;

    # Upstream to abstract backend connection(s) for PHP.
    upstream php {
        #this should match value of "listen" directive in php-fpm pool
        #server unix:/tmp/php-fpm.sock;
        server localhost:9000;
    }

    # Main HTTPS server handling the Laravel application.
    server {
            listen 80;
            listen 443 ssl default_server;
            server_name _;

            ssl_certificate     /etc/nginx/certs/server.pem;
            ssl_certificate_key /etc/nginx/certs/server.key;

            # Serve the Laravel public directory as the web root.
            root /var/www/html/public;

            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-XSS-Protection "1; mode=block";
            add_header X-Content-Type-Options "nosniff";

            index index.html index.htm index.php;

            charset utf-8;

            # Reject plain-HTTP requests that do not come from a private (proxy-side) address.
            if ($deny_http) {
                    return 444;
            }

            location /mqtt {
                    proxy_pass http://mosquitto:9001;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection $connection_upgrade;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_ssl_server_name on;
                    proxy_ssl_verify off;
                    proxy_buffering off;
                    proxy_read_timeout 86400;
                    proxy_send_timeout 86400;
            }

            location / {
                    try_files $uri $uri/ /index.php?$query_string;
            }

            # Prevent Direct Access To Protected Files
            location ~ \.(env|log) {
                    deny all;
            }

            # Prevent Direct Access To Protected Folders
            location ~ ^/(app|bootstrap|config|database|overrides|resources|routes|storage|tests|artisan) {
                    deny all;
            }

            # Prevent Direct Access To modules/vendor Folders Except Assets
            location ~ ^/(modules|vendor)\/(.*)\.((?!ico|gif|jpg|jpeg|png|js\b|css|less|sass|font|woff|woff2|eot|ttf|svg).)*$ {
                    deny all;
            }

            error_page 404 /index.php;

            # Pass PHP Scripts To FastCGI Server
            location ~ \.php$ {
                    fastcgi_split_path_info ^(.+\.php)(/.+)$;
                    fastcgi_pass php;
                    fastcgi_index index.php;
                    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                    include fastcgi_params;
            }

            location ~ /\.(?!well-known).* {
                    deny all;
            }
    }
}

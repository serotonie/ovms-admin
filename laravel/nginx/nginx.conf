# Generic startup file for the Laravel application behind Nginx.
user www-data;

# Run one worker per CPU by default for better concurrency on the container host.
worker_processes  auto;
worker_cpu_affinity auto;

error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

# Keeps the logs free of messages about not being able to bind().
#daemon     off;

events {
    worker_connections  1024;
}

http {
#   rewrite_log on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    # Load the standard MIME type mappings used by Nginx.
    include mime.types;
    default_type       application/octet-stream;

    # Security: Hide Nginx version number in error pages and Server headers.
    server_tokens off;

    # Trust the forwarded client IP from any reverse proxy in logs.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.1/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    
    # Security: Prevent IP spoofing by enforcing recursive proxy trust validation.
    real_ip_recursive on;

    # Define a custom log format using the verified real client IP ($realip_remote_addr)
    log_format main_realip '$realip_remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent"';

    # Standard logs and basic performance settings (using the new log format).
    access_log         /var/log/nginx/access.log main_realip;
    sendfile           on;
#   tcp_nopush         on;
    keepalive_timeout  64;
#   tcp_nodelay        on;

    # Security / Protection: Rate limiting zone based on verified client IP.
    limit_req_zone $realip_remote_addr zone=laravel_app:10m rate=10r/s;

    # Enable gzip compression for common text and web asset formats.
    gzip on;
    gzip_disable "msie6";

    disable_symlinks off;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Limit the maximum client upload size to match the application constraints.
    client_max_body_size 13m;
    index              index.php index.html index.htm;

    # Upstream to abstract backend connection(s) for PHP.
    upstream php {
        #this should match value of "listen" directive in php-fpm pool
        #server unix:/tmp/php-fpm.sock;
        server localhost:9000;
    }

    # Dual HTTP/HTTPS server handling the Laravel application (IPv4 only).
    server {
            listen 80 default_server;
            listen 127.0.0.1:80;
            server_name localhost;

            root /var/www/html/public;
            index index.php index.html index.htm;

            location / {
                    try_files $uri $uri/ /index.php?$query_string;
            }

            location ~ \.php$ {
                    fastcgi_split_path_info ^(.+\.php)(/.+)$;
                    fastcgi_pass php;
                    fastcgi_index index.php;
                    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                    fastcgi_param HTTPS off;
                    fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
                    fastcgi_param HTTP_X_FORWARDED_HOST $host;
                    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
                    include fastcgi_params;
            }
    }

    # Main HTTPS server handling the Laravel application.
    server {
            listen 443 ssl default_server;
            
            # Matches the container's network alias / hostname
            server_name frontend;

            # SSL Configuration for flexibility (e.g., self-signed certificates)
            ssl_certificate     /etc/nginx/certs/server.pem;
            ssl_certificate_key /etc/nginx/certs/server.key;

            # Security: Modern TLS enforcement, disabling weak TLS 1.0 & 1.1
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_prefer_server_ciphers on;
            ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

            # Serve the Laravel public directory as the web root.
            root /var/www/html/public;

            # Security: HTTP Security Headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;

            index index.html index.htm index.php;

            charset utf-8;

            # Reverse proxy configuration for MQTT WebSockets (Mosquitto)
            location /mqtt {
                    proxy_pass http://mosquitto:9001;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection $connection_upgrade;
                    
                    # Forces the Host header to match the internal container resolution
                    proxy_set_header Host frontend;
                    
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $forwarded_proto;
                    proxy_ssl_server_name on;
                    proxy_ssl_verify off;
                    proxy_buffering off;
                    proxy_read_timeout 86400;
                    proxy_send_timeout 86400;
            }

            # Laravel URL Routing Core with Rate Limiting protection
            location / {
                    limit_req zone=laravel_app burst=20 nodelay;
                    try_files $uri $uri/ /index.php?$query_string;
            }

            location = /favicon.ico { access_log off; log_not_found off; }
            location = /robots.txt  { access_log off; log_not_found off; }

            error_page 404 /index.php;

            # Pass PHP Scripts To FastCGI Server
            location ~ \.php$ {
                    fastcgi_split_path_info ^(.+\.php)(/.+)$;
                    fastcgi_pass php;
                    fastcgi_index index.php;
                    # Mitigates symlink vulnerabilities and helps PHP opcode caches
                    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
                    fastcgi_param DOCUMENT_ROOT $realpath_root;
                    fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
                    fastcgi_param HTTP_X_FORWARDED_HOST $host;
                    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
                    include fastcgi_params;
            }

            # Prevent Direct Access To Hidden Files (except Let's Encrypt validation)
            location ~ /\.(?!well-known).* {
                    deny all;
            }

            # Aggressive Browser Caching for Assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
                    expires 1y;
                    add_header Cache-Control "public, no-transform";
                    access_log off;
                    log_not_found off;
            }
    }
}

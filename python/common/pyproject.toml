[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common"
version = "0.1.0"
description = "Common MQTT and database utilities"
requires-python = ">=3.10"
dependencies = [
  "bcrypt",
  "nanoid",
  "paho-mqtt",
  "peewee",
  "psycopg2-binary",
  "PyMySQL",
  "resettabletimer",
  "valkey",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
  "database",
  "setup",
  "utils",
]
py-modules = ["common"]

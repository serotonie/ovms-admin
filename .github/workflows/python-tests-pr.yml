name: Python tests PR

on:
  pull_request:
    paths:
      - python/**
      - .github/workflows/python-tests-pr.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/trips-recorder

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            python/trips-recorder/requirements.txt

      - name: Start Redis for tests
        run: |
          docker run -d --name ovms-admin-test-redis -p 6379:6379 valkey/valkey:7.2
          until docker exec ovms-admin-test-redis redis-cli ping; do sleep 1; done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Python tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 2
        run: |
          pytest -q ./src/tests

name: Docker build validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "laravel/**"
      - "mosquitto/**"
      - "python/**"
      - ".github/workflows/docker-build-pr.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [migrator, scheduler, queue-worker, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Laravel image (${{ matrix.target }})
        uses: docker/build-push-action@v7
        with:
          context: laravel
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=registry,ref=ghcr.io/serotonie/ovms-admin_${{ matrix.target }}:buildcache
          cache-to: type=registry,ref=ghcr.io/serotonie/ovms-admin_${{ matrix.target }}:buildcache,mode=max

  mosquitto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Mosquitto image
        uses: docker/build-push-action@v7
        with:
          context: mosquitto
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=registry,ref=ghcr.io/serotonie/ovms-admin_mosquitto:buildcache
          cache-to: type=registry,ref=ghcr.io/serotonie/ovms-admin_mosquitto:buildcache,mode=max

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Python image
        uses: docker/build-push-action@v7
        with:
          context: python
          target: trips_recorder
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=registry,ref=ghcr.io/serotonie/ovms-admin_trips-recorder:buildcache
          cache-to: type=registry,ref=ghcr.io/serotonie/ovms-admin_trips-recorder:buildcache,mode=max
